<nav class="flex wrap m-center fade" id="lists" style="text-align:center"></nav>

<div class="flex m-center container">
  <main class="left" id="record-detail"></main>
  <aside class="right" id="sidebar"></aside>
</div>

<script>
  // record.html?demon=<levelId>&player=<name> - one record's hosted video
  var params = new URLSearchParams(location.search);
  var demon = DL.demonById(params.get("demon"));
  var record = demon
    ? (demon.records || []).filter(function (r) { return r.player === params.get("player"); })[0]
    : null;

  if (!demon || !record || !record.video) {
    document.getElementById("record-detail").innerHTML =
      '<section class="panel fade"><h2>Video not found</h2>' +
      "<p>There's no video for that record.</p>" +
      '<a class="blue hover button" href="' + (demon ? DL.demonUrl(demon.id) : "index.html") + '">' +
      (demon ? "All " + DL.escapeHtml(demon.name) + " records" : "Back to the list") + "</a></section>";
    DL.renderListNav(document.getElementById("lists"), demon || null);
  } else {
    document.title = record.player + " – " + demon.name + " · " + window.SITE.name;
    DL.renderListNav(document.getElementById("lists"), demon);
    DL.renderRecordPage(document.getElementById("record-detail"), demon, record);
  }

  DL.renderSidebar(document.getElementById("sidebar"));
</script>
